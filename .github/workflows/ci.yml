name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
          cache: maven
      - name: Build functional (matching branch, else its default)
        run: |
          git clone https://github.com/tomasz-gac/functional.git "$HOME/functional"
          git -C "$HOME/functional" checkout "$GITHUB_REF_NAME" || true
          mvn -B -ntp install -DskipTests -f "$HOME/functional/pom.xml"
      - name: Build clauseway-vavr
        run: mvn -B -ntp install -f vavr/pom.xml
      - name: Test
        run: mvn -B -ntp test
